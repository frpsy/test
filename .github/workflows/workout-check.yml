name: workout-check tests

on:
  pull_request:
    paths: ['workout-check/**', '.github/workflows/workout-check.yml']
  push:
    branches: [main]
    paths: ['workout-check/**', '.github/workflows/workout-check.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workout-check/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:artifact
